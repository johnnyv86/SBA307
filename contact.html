<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main id="main-container">
        <section id="section1">

            <div class="box-b0-BusinessLogo"></div>
                <img 
                    src="BusinessLogo.png"
                    alt="Per Scholas Tea Business Logo" 
                    class="business-img" 
                    style="border: 3px solid white;">
                
            <div class="header-text"> 
                <h1 class="BusinessName">PER SCHOLAS TEA</h1> 
                <p class="BusinessSlogan">Brewing the Future</p>
        </section>

<hr class="section-hr">

            <nav>
                <ul class="mainNav">
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="rewards.html">No Brainer Rewards</a></li>
                <li><a class="active" href="contact.html">Contact</a></li>
                </ul>
            </nav>
	</section>

<hr class="section-hr">


<div class="GetUpdates">
            
            <h2 class="AnimatedHeader">Want Promo Notifications?</h3><br>
                <form action="#">
                    <label for="PromoEmail">Enter your email address:</label>
	                    <input type="email" id="PromoEmail" name="email" required><br>
                

                    <label for="FavTea">Favorite Tea Type:</label>
	                    <select id="FavTea" name="fav_tea">
	                        <option value="--Please choose an option--">-- Please choose an option --</option>							
	                        <option value="matcha">Matcha</option>
	                        <option value="black">Black Tea</option>
	                        <option value="herbal">Herbal</option>
	                        <option value="bubble">Bubble Tea</option>
	                    </select>

			   <div class="form group">
		            <input type="checkbox" name="PromoEmail" id="PromoEmail">
                        <label for="PromoEmail">I Agree to recieve promotional emails</label>    
		        </div>						

                    <button type="submit">Notify Me!</button>
                </form>
            </div>

<hr class="section-hr">

	<div class="ContactContainer">
		<h2 class="AnimatedHeader">We Want to Hear From You! 💬</h2>
		
<form action="#">
	<fieldset>
		<legend>Your Details</legend>
		   <label for="FirstName">First Name:</label>
		        <input type="text" name="FirstName" id="FirstName" placeholder="John" required><br>
		        
		   <label for="LastName">Last Name</label>
		        <input type="text" name="LastName" id="LastName" placeholder="Doe" required><br>
		        
		    <label for="ContactNumber">Contact Number:</label>
		        <input type="tel" name="ContactNumber" id="ContactNumber" placeholder="(###) ###-####"  required><br>
		        
			   <label for="Email">Email</label>
			        <input type="email" name="Email" id="Email" placeholder="johndoe@outlook.com" required><br>
	</fieldset>
	
	<fieldset>
		<legend>Visit Information</legend>
		   <label for="VisitDate">Date of Visit</label>
		        <input type="date" name="VisitDate" id="VisitDate" required><br>
        
				
		   <label for="ContactReason">Reason for Contact:</label>
		        <select name="ContactReason" id="ContactReason">
					<option value="-- Select an option --">-- Select an option --</option>
		            <option value="orderIssue">Order Issue</option>
		            <option value="staffIssue">Staff Issue</option>
		            <option value="locationIssue">Location Issue</option>
		            <option value="complement">Complements</option>
		            <option value="suggestions">Suggestions</option>
		            <option value="other">Other</option>
			    </select>
	</fieldset>

	<fieldset>
		<legend>Follow up Preferences</legend>
		   <label for="FollowUp">Please contact me about this issue</label>
		        <input type="checkbox" name="FollowUp" id="FollowUp"><br>
		        
		<p>Preferred Contact Method:</p>

		    <input type="radio" name="ContactMethod" id="PrefPhone" value="phone">
				<label for="PrefPhone">Phone</label>
	       
		    <input type="radio" name="ContactMethod" id="PrefEmail">
				<label for="PrefEmail">Email</label>

	   </fieldset>

	   <fieldset>
		<legend>Feedback</legend>
		        <textarea name="FeedBack" id="FeedBack" placeholder="Type your message here..." required></textarea>

   			</fieldset>


		    <input type="reset" value="Clear">   
		    <input type="submit" value="Send Message">

</div>
    </form>
</section>
</main>
    
</body>
</html>
