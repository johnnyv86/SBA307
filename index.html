<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Per Scholas Tea Index</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="main-container">
        <header id="section1">
            <div class="box b0-business">
                <img 
                    src="media/BusinessLogo.png" 
                    alt="Per Scholas Tea Business Logo" 
                    class="business-img">

                <hr class="section-hr">
            
                <div class="header-text"> 
                    <h1 class="BusinessName">PER SCHOLAS TEA</h1> 
                    <p class="BusinessSlogan">Brewing the Future</p>
                
                    <hr class="section-hr">

                    <div class="businessInfo-container">
                        <div class="businessInfo">
                            <img 
                                class="busIcon" 
                                src="media/Clock.png" 
                                alt="Business Hour Icon">
                            <h3>Business Hours</h3>
                            <p>Monday - Sunday<br>12pm - 12am</p>
                        </div>

                        <div class="businessInfo">
                            <img 
                                class="busIcon" 
                                src="media/Phone.svg" 
                                alt="Phone Icon">
                            <h3>Phone Number</h3>
                            <p>(305) 515-9041</p>
                            <a href="tel:+3055159041">Click to call!</a>
                        </div>
               
                        <div class="businessInfo">
                            <img 
                                class="busIcon" 
                                src="media/Location.jpeg" 
                                alt="Address Icon">
                            <h3>Address</h3>
                            <p>Brickell City Centre</p>
                            <p>701 S Miami Ave, Miami, FL 33130</p>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <hr class="section-hr">

        <nav>
            <ul class="mainNav">
                <li><a class="active" href="index.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="menuV2.html">Menu V2</a></li>
                <li><a href="rewards.html">Rewards</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>

        <hr class="section-hr">

    <main>
        <div class="box b1-video"> 
            <video class="mainVid" autoplay muted loop playsinline>
                    <source src="media/MainVideo.mp4" type="video/mp4">
                    Your browser does not support the video tag.
            </video>
        </div>

    <hr class="section-hr">

    <div class="box b2-promo">
        <h2 class="daily-title">Daily Specials!</h2>                
            <hr class="section-hr full-width-hr">
				<img src="media/Motivation-Monday.png" alt="Motivation Monday">
                <img src="media/Tech-Tuesday.png" alt="Tech Tuesday">
                <img src="media/Wisdom-Wednesday.png" alt="Wisdom Wednesday">
                <img src="media/Thinking-Cap-Thursday.png" alt="Thinking Cap Thursday">
                <img src="media/Future-Friday.png" alt="Future Friday">
                <img src="media/Study-Hall-Saturday.png" alt="Study Hall Saturday">
                <img src="media/Self-Care-Sunday.png" alt="Self-Care Sunday">
        </div>
        </main>
    </div>
</body>
</html>
